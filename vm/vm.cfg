# The VM image: header, the VM and fp816, then the program (TAIL marks where
# it begins).  Linked at $0000 of a bank and bank-independent: load it at
# offset 0 of any bank.
MEMORY {
    BANK: start = $0000, size = $10000, file = %O;
}
SEGMENTS {
    HEADER: load = BANK, type = ro;
    CODE:   load = BANK, type = ro;
    TAIL:   load = BANK, type = ro;
}
