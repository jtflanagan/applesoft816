# AS816.SYSTEM: the loader at $2000 (ProDOS 8 loads a system file there),
# then the resident trampolines, which it copies to RES_MLI in bank 0, and
# the launcher, which it copies to $1F00 to run a SYS file over itself.
MEMORY {
    LOAD: start = $2000, size = $7000, file = %O;
    RES:  start = $9780, size = $0080, file = "";
    TRAMP: start = $1F00, size = $0100, file = "";
}
SEGMENTS {
    LOADER:   load = LOAD, type = rw;
    RESIDENT: load = LOAD, run = RES, type = rw, define = yes;
    LAUNCH:   load = LOAD, run = TRAMP, type = rw, define = yes;
}
